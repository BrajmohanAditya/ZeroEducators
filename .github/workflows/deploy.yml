name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend (GitHub Free Runner)
        working-directory: frontend
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL || 'https://zeroeducators.com/api' }}
          VITE_CASHFREE_MODE: ${{ secrets.VITE_CASHFREE_MODE || 'production' }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || '454932120899-fk4tsb8bcvha6sbqblso70fq5agfi4r3.apps.googleusercontent.com' }}
        run: |
          npm ci || npm install --prefer-offline --no-audit --no-fund
          npm run build

      - name: Transfer Frontend Build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/home/ubuntu/frontend_dist"
          strip_components: 2
          rm: true

      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd /home/ubuntu/ZeroEducators

            echo "Pulling latest code from GitHub..."
            git pull origin main

            echo "--- Updating Backend ---"
            cd backend
            npm install --prefer-offline --no-audit --no-fund
            pm2 restart zeroeducators-backend || pm2 start index.js --name zeroeducators-backend
            cd ..

            echo "--- Updating Frontend on Nginx ---"
            sudo rm -rf /var/www/html/*
            sudo cp -r /home/ubuntu/frontend_dist/* /var/www/html/
            sudo rm -rf /home/ubuntu/frontend_dist

            echo "Deployment Completed Successfully!"
