name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            cd /home/ubuntu/ZeroEducators

            # 1. Enable 2GB Swap space if not present (prevents EC2 1GB RAM freeze)
            if [ ! -f /swapfile ]; then
              echo "Setting up 2GB swap space to avoid RAM freeze..."
              sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi

            echo "Pulling latest code from GitHub..."
            git pull origin main

            echo "--- Updating Backend ---"
            cd backend
            if [ ! -d "node_modules" ]; then
              npm install --prefer-offline --no-audit --no-fund
            fi
            pm2 restart zeroeducators-backend || pm2 start index.js --name zeroeducators-backend
            cd ..

            echo "--- Updating Frontend ---"
            cd frontend
            if [ ! -d "node_modules" ]; then
              npm install --prefer-offline --no-audit --no-fund
            fi

            echo "Building frontend with memory optimization..."
            export NODE_OPTIONS="--max-old-space-size=1024"
            npm run build

            echo "Copying new build to Nginx folder..."
            sudo rm -rf /var/www/html/*
            sudo cp -r dist/* /var/www/html/

            echo "Deployment Completed Successfully!"
